name: Fabrizio Romano Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      catchup:
        description: "Backlogni POSTLAMASDAN 'ko'rilgan' deb belgilash"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: fabrizio-bot-single-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          CATCHUP_MODE: ${{ github.event.inputs.catchup }}
        run: python main.py

      - name: bot_state.json'ni saqlash
        if: always()
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config --global user.name "fabrizio-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add bot_state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: bot_state yangilandi"
            git pull --rebase origin main
            git push
          fi
